<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tinylab bench</title>
<style>
  :root { --bg: #fff; --fg: #1a1a1a; --muted: #666; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #e8e8e8; --muted: #999; } }
  body { background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; margin: 2rem auto; max-width: 46rem; padding: 0 16px; }
  pre { white-space: pre-wrap; }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<h1>tinylab bench</h1>
<p class="muted">Loads a <code>.tlab</code> model, checks it against the exporter's reference embeddings, and times
embedding on this browser's main thread. Model directory: <code>?model=</code> (default <code>/dist/tinylab-student-v1</code>).</p>
<pre id="out">running...</pre>
<script type="module">
import { Student } from "./src/tinylab.js";

const out = document.getElementById("out");
const lines = [];
const log = (line) => { lines.push(line); out.textContent = lines.join("\n"); console.log(line); };

const dir = new URLSearchParams(location.search).get("model") ?? "/dist/tinylab-student-v1";
try {
  const started = performance.now();
  const buffer = await (await fetch(`${dir}/student.tlab`)).arrayBuffer();
  const student = Student.fromBuffer(buffer);
  log(`loaded ${buffer.byteLength.toLocaleString()} bytes in ${(performance.now() - started).toFixed(1)} ms: ` +
      `${student.spec.numBuckets} buckets x ${student.dims} dims`);

  const goldens = await (await fetch(`${dir}/goldens.json`)).json();
  let worst = 0;
  for (const { text, vector } of goldens.cases) {
    const got = student.embed(text);
    worst = Math.max(worst, ...vector.map((x, d) => Math.abs(x - got[d])));
  }
  log(`parity: ${goldens.cases.length} reference texts, max abs diff ${worst.toExponential(2)} ` +
      (worst < 1e-6 ? "(match)" : "(MISMATCH)"));

  const queries = goldens.cases.map((c) => c.text).filter((t) => t.length > 0 && t.length < 80);
  const passage = "Wrap many inserts in a single transaction and index after loading. ".repeat(10).slice(0, 600);
  for (const [label, texts, rounds] of [["query", queries, 200], ["512-byte passage", [passage], 2000]]) {
    for (const text of texts) student.embed(text);
    const times = [];
    for (let round = 0; round < rounds; round++) {
      for (const text of texts) {
        const t0 = performance.now();
        student.embed(text);
        times.push(performance.now() - t0);
      }
    }
    times.sort((a, b) => a - b);
    const mean = times.reduce((a, b) => a + b, 0) / times.length;
    log(`${label}: mean ${mean.toFixed(3)} ms, p95 ${times[Math.floor(times.length * 0.95)].toFixed(3)} ms ` +
        `over ${times.length} runs`);
  }
  log(`user agent: ${navigator.userAgent}`);
} catch (error) {
  log(`error: ${error.message}`);
}
</script>
</body>
</html>
