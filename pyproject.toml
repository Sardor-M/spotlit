[project]
name = "tinylab"
version = "0.0.0"
description = "Tokenizer-free tiny text embedding models that run on device"
requires-python = ">=3.12,<3.14"

# Empty on purpose: the eval harness is stdlib-only. Training deps land with ADR-0003.
dependencies = []

[project.optional-dependencies]
# Isolated so the eval harness and the C++ side stay dependency-free.
teacher = ["sentence-transformers>=3,<6", "datasets>=3,<5"]
# Training on Apple Silicon; see docs/all/learnings/02-mlx/.
train = ["mlx>=0.20", "numpy>=1.26"]
export = [
    "onnx>=1.23.2",
    "onnxruntime>=1.31.0",
    "onnxscript>=0.7.2",
]

[project.scripts]
# One entry point per pipeline stage. Later stages land with their ADRs.
tinylab-eval = "tinylab.eval.cli:main"
tinylab-build-lumen = "tinylab.data.build_lumen_set:main"
tinylab-encoder-goldens = "tinylab.data.make_encoder_goldens:main"
tinylab-build-training-set = "tinylab.data.build_training_set:main"
tinylab-build-technical-set = "tinylab.data.build_technical_set:main"
tinylab-build-design-set = "tinylab.data.build_design_set:main"
tinylab-label = "tinylab.data.label_with_teacher:main"
tinylab-train = "tinylab.train.distill:main"
tinylab-train-contextual = "tinylab.train.contextual:main"
tinylab-fit = "tinylab.train.fit_linear:main"
tinylab-export = "tinylab.export.linear:main"
tinylab-build-mind2web = "tinylab.agent.build_mind2web:main"
tinylab-rank-elements = "tinylab.agent.rank:main"
tinylab-train-ranker = "tinylab.agent.train_ranker:main"
tinylab-train-reranker = "tinylab.agent.train_reranker:main"
tinylab-export-reranker = "tinylab.agent.export_reranker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/tinylab"]
