[project]
name = "tinylab"
version = "0.0.0"
description = "Tokenizer-free tiny text embedding models that run on device"
requires-python = ">=3.12,<3.14"

# Empty on purpose: the eval harness is stdlib-only. Training deps land with ADR-0003.
dependencies = []

[project.optional-dependencies]
# Isolated so the eval harness and the C++ side stay dependency-free.
teacher = ["sentence-transformers>=3,<6"]

[project.scripts]
# One entry point per pipeline stage. Later stages land with their ADRs.
tinylab-eval = "tinylab.eval.cli:main"
tinylab-build-lumen = "tinylab.data.build_lumen_set:main"
tinylab-encoder-goldens = "tinylab.data.make_encoder_goldens:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/tinylab"]
